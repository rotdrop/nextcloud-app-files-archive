# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Basic checks on pull requests and pushes to main via the shared CI
# workflow of the build system (eslint, php -l, realclean, archive build),
# plus a build of the app archive via the shared build-appstore workflow.
#
# The built archive is then installed on fresh Nextcloud instances and
# used to update from earlier releases, with a smoke test of the API and
# the occ commands (scripts in tests/ci, which also run locally with
# docker only).
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check smoke-test assertion helpers
        run: bash tests/ci/test-shell-helpers.sh

  ci:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/ci.yml@v1
    with:
      php-versions: '["8.4", "8.5"]'
      php-lint-dirs: lib appinfo templates composer

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install PHPUnit
        working-directory: vendor-bin/phpunit
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Run unit tests
        run: vendor-bin/phpunit/vendor/bin/phpunit -c phpunit.xml

  build:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/build-appstore.yml@v1

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the dependencies in appinfo/info.xml.
        nextcloud: ['33', '34', '35']
        database: [sqlite, pgsql, mysql]
    name: install (NC ${{ matrix.nextcloud }}, ${{ matrix.database }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the app archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Record candidate provenance
        env:
          ARCHIVE: ${{ needs.build.outputs.archive-filename }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          SOURCE_REF: ${{ needs.build.outputs.source-ref }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          printf 'CI candidate: `%s` (checkout `%s` at `%s`)\n' "$ARCHIVE" "$SOURCE_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Fresh install and smoke test
        env:
          ARCHIVE: ${{ needs.build.outputs.archive-filename }}
        run: tests/ci/test-install.sh ${{ matrix.nextcloud }} ${{ matrix.database }} "$ARCHIVE"

  update:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # From the latest release on the same server version.
          - {from-release: latest, from-nextcloud: '33', nextcloud: '33', database: pgsql}
          - {from-release: latest, from-nextcloud: '34', nextcloud: '34', database: sqlite}
          - {from-release: latest, from-nextcloud: '35', nextcloud: '35', database: mysql}
    name: update (${{ matrix.from-release }} on NC ${{ matrix.from-nextcloud }} -> NC ${{ matrix.nextcloud }}, ${{ matrix.database }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the app archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Record candidate provenance
        env:
          ARCHIVE: ${{ needs.build.outputs.archive-filename }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          SOURCE_REF: ${{ needs.build.outputs.source-ref }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          printf 'CI candidate: `%s` (checkout `%s` at `%s`)\n' "$ARCHIVE" "$SOURCE_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          # Always the upstream releases, also when running in a fork.
          REPO: rotdrop/nextcloud-app-files-archive
          TAG: ${{ matrix.from-release }}
        run: |
          if [ "$TAG" = latest ]; then
            TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          fi
          gh release download "$TAG" --repo "$REPO" --pattern '*.tar.gz' --dir previous
          archives=(previous/*.tar.gz)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ] || {
            echo "::error::Expected exactly one previous release archive"
            exit 1
          }
          echo "tarball=${archives[0]}" >> "$GITHUB_OUTPUT"
          printf 'Upgrade baseline: release `%s`, archive `%s`\n' "$TAG" "${archives[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update and smoke test
        env:
          ARCHIVE: ${{ needs.build.outputs.archive-filename }}
          BASELINE: ${{ steps.previous.outputs.tarball }}
        run: >-
          tests/ci/test-update.sh
          ${{ matrix.from-nextcloud }} ${{ matrix.nextcloud }} ${{ matrix.database }}
          "$BASELINE" "$ARCHIVE"
