# Thin caller of the shared release workflow of the build system.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/release.yml@v1
    secrets: inherit
    permissions:
      contents: write
    with:
      php-version: '8.4'
