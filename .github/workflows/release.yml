# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Attach the ready-to-use app archive to the GitHub release whenever a
# `vX.Y.Z` or `vX.Y.Z-rcW` tag is pushed (other tags are ignored) and
# upload it to the Nextcloud app store. The build itself lives in the reusable
# build-appstore.yml workflow, shared with the CI checks on pull
# requests. The job can also be triggered manually (workflow_dispatch)
# to test the build without creating a tag; in that case the tarball is
# only kept as a workflow artifact and not attached to any release.
name: Build release tarball

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-appstore.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    environment: NextcloudAppstore
    runs-on: ubuntu-latest
    steps:
      - name: Download the tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Check that the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The app store derives pre-release status from the version in info.xml.
          test "${TAG#v}" = "$VERSION" || { echo "::error::Tag $TAG does not match appinfo/info.xml version $VERSION"; exit 1; }

      - name: Determine whether this is a pre-release
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only plain vX.Y.Z is a final release.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous_stable="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -r --arg current "$TAG" \
              'add | map(select(.draft == false and .prerelease == false and .tag_name != $current)) | sort_by(.published_at) | last | .tag_name // empty')"

          if [[ -z "$previous_stable" ]]; then
            echo "::error::Could not find a previous stable release for $TAG."
            exit 1
          fi

          body_path="$RUNNER_TEMP/release-notes.md"
          printf 'See [CHANGELOG.md](%s/blob/%s/CHANGELOG.md).\n\n**Full Changelog**: %s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$TAG" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$previous_stable" \
            "$TAG" > "$body_path"
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.kind.outputs.prerelease }}
          files: files_archive-${{ needs.build.outputs.version }}.tar.gz
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true

      - name: Upload to the Nextcloud app store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/files_archive-${VERSION}.tar.gz"
          printf '%s' "$APP_PRIVATE_KEY" > key.pem
          signature=$(openssl dgst -sha512 -sign key.pem "files_archive-${VERSION}.tar.gz" | openssl base64 -A)
          rm -f key.pem
          # Never a nightly; pre-release status follows from the -rcW version.
          curl --fail-with-body -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${APPSTORE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"download\":\"${url}\",\"signature\":\"${signature}\",\"nightly\":false}"
